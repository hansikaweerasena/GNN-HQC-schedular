[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-aer"
version = "0.1.0"
description = "MOSAIC Phase-0 Aer harness: assignment -> physics-grounded fidelity, independent of EFCL"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["mosaic_aer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
